name: Release

# Triggered by version tags (vX.Y.Z). Also runnable manually via
# workflow_dispatch (builds + uploads artifacts, but the publish job only
# creates a GitHub Release when the run is on a tag ref).
#
# Every artifact is built by the same scripts/build_* script a developer
# would run, so it is named loadmaster-<version>-<os>-<arch>[.exe] (version
# from src/core/version.h), comes with a .sha256, and is checked with
# scripts/check_obfuscation.sh before it is uploaded.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ----- Linux: manylinux2014 inside Docker on a native host of each arch --
  # The portable binary links glibc dynamically (so the GPU module can dlopen
  # vendor libraries), so it must be built against an old glibc baseline.
  # manylinux2014 pins glibc 2.17, giving cross-distro portability.
  linux:
    name: Linux ${{ matrix.arch }} (manylinux)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { arch: x86_64,  os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Build portable binary (manylinux2014)
        run: scripts/build_linux.sh --arch ${{ matrix.arch }}
      - name: Check obfuscation
        run: scripts/check_obfuscation.sh dist/loadmaster-*-linux-${{ matrix.arch }}
      - name: Smoke test
        run: timeout 30 dist/loadmaster-*-linux-${{ matrix.arch }} -h
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ----- macOS: Apple Silicon runner builds the arm64 binary only ----------
  # Deployment target 11.0 (set in the script). Not statically linked (Apple
  # ships no static libc++/libSystem), so it relies on the OS-provided
  # dylibs. macos-15 gives Xcode 16; std::jthread on Apple libc++ is enabled
  # via -fexperimental-library in src/CMakeLists.txt. x86_64 macOS is
  # intentionally dropped -- the deliverable is arm64-only.
  macos:
    name: macOS (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Install CMake
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install cmake
      - name: Build arm64
        run: scripts/build_macos.sh --arch arm64
      - name: Check obfuscation
        run: scripts/check_obfuscation.sh dist/loadmaster-*-macos-arm64
      # GNU timeout isn't installed on macOS runners; -h returns immediately.
      - name: Smoke test
        run: dist/loadmaster-*-macos-arm64 -h
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*
          if-no-files-found: error

  # ----- Windows x86_64: VS 2022 (static /MT runtime via CMake) ------------
  # Pin windows-2022: this org's windows-latest no longer exposes a VS
  # instance to vswhere, so the "Visual Studio 17 2022" generator errors out.
  windows:
    name: Windows x86_64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Build
        run: scripts\build_windows.ps1
      - name: Check obfuscation and smoke test
        run: |
          $exe = Get-ChildItem dist\loadmaster-*-windows-x86_64.exe | Select-Object -First 1
          # Same markers as scripts/check_obfuscation.sh.
          $text = [IO.File]::ReadAllText($exe.FullName, [Text.Encoding]::ASCII)
          if ($text -match 'target CPU usage|\.entry busy|void busy') {
            throw "$($exe.Name) contains plaintext that should be obfuscated: $($Matches[0])"
          }
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '-h' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed: exit $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error

  # ----- Publish: assemble all artifacts into a GitHub Release ------------
  publish:
    name: Publish GitHub Release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # gh release create
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Check artifacts match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls -la release
          for f in release/*; do
            case "${f}" in
              release/loadmaster-"${version}"-*) ;;
              *) echo "::error::${f} does not match tag ${GITHUB_REF_NAME} (bump src/core/version.h?)"; exit 1 ;;
            esac
          done
          (cd release && sha256sum -c ./*.sha256)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --latest \
            release/*
