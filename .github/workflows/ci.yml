name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}${{ matrix.cxx && format(' / {0}', matrix.cxx) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (host arch; native toolchain, no Docker needed)
          - { os: ubuntu-24.04,     preset: debug }
          - { os: ubuntu-24.04,     preset: release }
          - { os: ubuntu-24.04,     preset: release, cxx: clang++ }
          - { os: ubuntu-24.04,     preset: sanitize }
          - { os: ubuntu-24.04,     preset: tsan }
          # LOADMASTER_SILENT compiles every LOG_* site out; -Werror then
          # catches variables only a log call used.
          - { os: ubuntu-24.04,     preset: silent }
          - { os: ubuntu-24.04,     preset: silent, cxx: clang++ }
          # Linux arm64 (host arch)
          - { os: ubuntu-24.04-arm, preset: debug }
          - { os: ubuntu-24.04-arm, preset: release }
          - { os: ubuntu-24.04-arm, preset: tsan }
          # macOS arm64 only (Apple Silicon; macos-15 = Xcode 16). x86_64 macOS is
          # intentionally dropped -- the user accepts an arm64-only macOS deliverable.
          # std::jthread on Apple libc++ is enabled via -fexperimental-library in
          # src/CMakeLists.txt (see there).
          - { os: macos-15,         preset: macos-arm64-debug }
          - { os: macos-15,         preset: macos-arm64-release }
          # Windows x64 (pin windows-2022: it ships VS 2022; windows-latest here
          # no longer exposes a VS instance to vswhere, so the VS generator fails)
          - { os: windows-2022,     preset: windows-debug }
          - { os: windows-2022,     preset: windows-release }
          - { os: windows-2022,     preset: windows-silent }
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Select compiler
        if: matrix.cxx
        run: echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      # -- ccache (Linux & macOS only; skipped on Windows) ------------------
      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Install ccache + CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ccache cmake

      - name: Cache ccache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-ci-${{ matrix.os }}-${{ matrix.preset }}-${{ matrix.cxx }}-${{ github.sha }}
          restore-keys: |
            ccache-ci-${{ matrix.os }}-${{ matrix.preset }}-${{ matrix.cxx }}-

      - name: Cache ccache (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ci-${{ matrix.os }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-ci-${{ matrix.os }}-${{ matrix.preset }}-

      # The sanitizers' shadow-memory layout breaks with the 32-bit mmap
      # randomisation some runner kernels use.
      - name: Limit mmap randomisation for the sanitizers
        if: runner.os == 'Linux' && (matrix.preset == 'sanitize' || matrix.preset == 'tsan')
        run: sudo sysctl vm.mmap_rnd_bits=28

      # -- Configure / Build / Test ----------------------------------------
      # ccache is picked up automatically when installed (LOADMASTER_CCACHE).
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DLOADMASTER_WERROR=ON

      - name: Build
        # Auto-detect build parallelism per runner (avoid -j with no arg, which
        # Make treats as UNLIMITED and thrashes low-core machines).
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} -j $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

      - name: Test
        shell: bash
        run: ctest --preset ${{ matrix.preset }} -j $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4) --timeout 300

  freebsd:
    name: freebsd / run_tests.sh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Build and run tests in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y bash cmake ninja
          run: bash scripts/run_tests.sh --werror
